name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real document, company profile or exported file.** Reproduce the problem with a made-up file. A leak goes to the Security tab, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: Steps with a made-up document and profile. Describe the file's structure if you cannot share it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DocSan version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: checkboxes
    id: synthetic
    attributes:
      label: Data
      options:
        - label: Everything in this issue is made up; it contains no real document, profile or company name.
          required: true
